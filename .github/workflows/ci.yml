name: CI

on:
  push:
    # main is covered by the deploy workflow, which runs this file first, so CI never runs twice on the same commit
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [library, group]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
            # the tests need a real SQL Server
            # CI starts the same one docker-compose runs locally (with the example passwords)
      - name: Start SQL Server and create the databases
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --wait sqlserver
          docker compose run --rm db-init
      - name: Point the tests at this service's database
        working-directory: .
        run: |
          set -a; source .env; set +a
          if [ "${{ matrix.service }}" = "library" ]; then
            password="$LIBRARY_DB_PASSWORD"
          else
            password="$GROUP_DB_PASSWORD"
          fi
          echo "DATABASE_URL=mssql://${{ matrix.service }}_user:${password}@localhost:1433/${{ matrix.service }}_db" >> "$GITHUB_ENV"
      - run: pytest --cov=${{ matrix.service }} --cov=database --cov-report=term-missing --cov-fail-under=70

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [library, group]
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/game-night-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max